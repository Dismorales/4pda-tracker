<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4PDA Tracker — темы</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <h1>Темы и история</h1>
    <p>Здесь хранятся темы, посты и сборки.</p>

    <p id="status" role="status"></p>
    <section>
      <h2>Резервная копия</h2>
      <p>Сохраните локальные темы, посты и сборки в JSON или восстановите их из ранее сохранённого файла.</p>
      <div class="row-actions">
        <button id="exportBackup">Скачать резервную копию</button>
        <button id="importBackup">Восстановить из файла</button>
      </div>
      <input id="backupFile" type="file" accept="application/json,.json" hidden>
      <p id="backupStatus" role="status"></p>
    </section>

    <section>
      <h2>Темы</h2>
      <div id="topics"></div>
    </section>

    <section>
      <h2>Сборки</h2>
      <div id="batches"></div>
    </section>
  </main>

  <script src="common.js"></script>
  <script src="markdown.js"></script>
  <script src="render-utils.js"></script>
  <script src="options.js"></script>
</body>
</html>
